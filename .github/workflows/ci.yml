name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Workspace typecheck and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Typecheck frontend and API
        run: pnpm typecheck
      - name: Build Vite frontend
        run: pnpm build
      - name: Build NestJS API
        run: pnpm build:api

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies every migration; fails on SQL errors)
        run: supabase start
