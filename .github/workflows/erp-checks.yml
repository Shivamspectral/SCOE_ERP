name: ERP app checks

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/erp-checks.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/erp-checks.yml"
  workflow_dispatch:

jobs:
  web:
    name: Vite frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile
      - name: Build web app
        working-directory: apps/web
        run: pnpm build

  api:
    name: NestJS API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: apps/api
        run: pnpm install --no-frozen-lockfile
      - name: Build API
        working-directory: apps/api
        run: pnpm build
